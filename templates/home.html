<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Predictor</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:500px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input,select{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#007BFF;
            color:white;
            font-size:18px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .result{
            margin-top:20px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            color:green;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Maths Score Predictor</h1>

        <form action="/predictdata" method="POST">

            <!-- Gender -->

            <div class="form-group">

                <label>Gender</label>

                <select name="gender" required>

                    <option selected disabled>
                        Select your Gender
                    </option>

                    <option value="male">Male</option>

                    <option value="female">Female</option>

                </select>

            </div>

            <!-- Ethnicity -->

            <div class="form-group">

                <label>Race or Ethnicity</label>

                <select name="ethnicity" required>

                    <option selected disabled>
                        Select Ethnicity
                    </option>

                    <option value="group A">Group A</option>

                    <option value="group B">Group B</option>

                    <option value="group C">Group C</option>

                    <option value="group D">Group D</option>

                    <option value="group E">Group E</option>

                </select>

            </div>

            <!-- Parent Education -->

            <div class="form-group">

                <label>Parental Level of Education</label>

                <select name="parental_level_of_education" required>

                    <option selected disabled>
                        Select Parent Education
                    </option>

                    <option value="associate's degree">
                        Associate's Degree
                    </option>

                    <option value="bachelor's degree">
                        Bachelor's Degree
                    </option>

                    <option value="high school">
                        High School
                    </option>

                    <option value="master's degree">
                        Master's Degree
                    </option>

                    <option value="some college">
                        Some College
                    </option>

                    <option value="some high school">
                        Some High School
                    </option>

                </select>

            </div>

            <!-- Lunch -->

            <div class="form-group">

                <label>Lunch Type</label>

                <select name="lunch" required>

                    <option selected disabled>
                        Select Lunch Type
                    </option>

                    <option value="standard">
                        Standard
                    </option>

                    <option value="free/reduced">
                        Free/Reduced
                    </option>

                </select>

            </div>

            <!-- Test Preparation -->

            <div class="form-group">

                <label>Test Preparation Course</label>

                <select name="test_preparation_course" required>

                    <option selected disabled>
                        Select Test Course
                    </option>

                    <option value="none">
                        None
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                </select>

            </div>

            <!-- Writing Score -->

            <div class="form-group">

                <label>Writing Score out of 100</label>

                <input type="number"
                       name="writing_score"
                       placeholder="Enter your Writing Score"
                       min="0"
                       max="100"
                       required>

            </div>

            <!-- Reading Score -->

            <div class="form-group">

                <label>Reading Score out of 100</label>

                <input type="number"
                       name="reading_score"
                       placeholder="Enter your Reading Score"
                       min="0"
                       max="100"
                       required>

            </div>

            <!-- Submit Button -->

            <button type="submit">

                Predict Maths Score

            </button>

        </form>

        <div class="result">

            Predicted Maths Score is: {{results}}

        </div>

    </div>

</body>

</html>
